server.port=${PORT:8080}
spring.application.name=egrocery-backend


# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=${DB_URL}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:egrocery_app}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =====================================================
# MAIL
# =====================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =====================================================
# JWT
# =====================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=egrocery-store

app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}


# =====================================================
# CORS
# =====================================================

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost}


# =====================================================
# SHOP
# =====================================================

app.shop.name=${SHOP_NAME:My Grocery Store}
app.shop.latitude=${SHOP_LATITUDE:11.6643}
app.shop.longitude=${SHOP_LONGITUDE:78.1460}


# =====================================================
# ADMIN
# =====================================================

app.admin.email=${ADMIN_EMAIL:admin@egrocery.com}
app.admin.password=${ADMIN_PASSWORD}


# =====================================================
# RAZORPAY
# =====================================================

app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}


# =====================================================
# AI
# =====================================================

spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:}

spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.3}


# =====================================================
# FRONTEND
# =====================================================

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost}


# =====================================================
# SWAGGER
# =====================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


# =====================================================
# HEALTH
# =====================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# =====================================================
# LOGGING
# =====================================================

logging.level.com.egrocery.store=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN