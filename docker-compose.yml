services:

  mysql:
    image: mysql:8.4
    container_name: egrocery-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-egrocery_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:-egrocery_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

    ports:
     - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: ./store
      dockerfile: Dockerfile

    container_name: egrocery-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-egrocery_db}
      DB_USERNAME: ${DB_USERNAME:-egrocery_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@egrocery.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

    ports:
      - "8080:8080"

    volumes:
      - backend_uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


  frontend:
    build:
      context: ./store-frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}

    container_name: egrocery-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"


volumes:
  mysql_data:
  backend_uploads: